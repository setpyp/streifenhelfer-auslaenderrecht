# Prüft jede Änderung: Regressionstests des Regelwerks und Auflösung aller Normzitate (ohne Download).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # vom Rechtsdaten-Workflow ausgelöst (Bot-PRs starten keine CI von selbst)

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regressionstests Regelwerk
        run: node tests/run_tests.mjs
      - name: Sprachsteuerung (Raspberry Pi) – Dialog und Bewertung
        run: python -m unittest discover -s pi -p "test_*.py" -v
      - name: Normzitate gegen Rechtsdatenpaket prüfen
        run: python tools/build_rechtsdaten.py --pruefen
      - name: Paketgrößen
        run: |
          {
            echo "### Paketgrößen"
            echo '| Datei | Bytes | gzip |'
            echo '|---|---:|---:|'
            for f in app/*; do echo "| $(basename "$f") | $(stat -c%s "$f") | $(gzip -c "$f" | wc -c) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
